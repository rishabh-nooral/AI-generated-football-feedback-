<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Player Observation</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .player-info {
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            min-height: 220px;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        button,
        .back-button {
            padding: 11px 18px;
            border-radius: 7px;
            border: none;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            background: #f6fa00;
            color: rgba(226, 241, 12, 0.904);
        }

        button:hover {
            background: #d3e90a;
        }

        .back-button {
            background: #d8bc1c;
            color: #ceab0e;
        }

        .back-button:hover {
            background: #e0d204;
        }

    </style>
</head>

<body>

<form class="user-delete-account" method="POST" action="{{ url_for('delete_account') }}" onsubmit="return confirm('Warning: deleting your account will permanently remove your access. Your account will be kept as a passive user for admin history. Continue?');">
    <button type="submit">Delete account</button>
</form>
<a class="user-logout-link" href="{{ url_for('logout') }}">Log out</a>

<div class="container">

    <div class="card">

        <h1>Player Observation</h1>

        <div class="player-info">

            <strong>{{ player['player_name'] }}</strong>

            <br>

            Position: {{ player['position'] }}

            {% if player['jersey_number'] %}
                <br>
                Jersey Number: {{ player['jersey_number'] }}
            {% endif %}

        </div>


        <form method="POST">

            <label for="coach_observation">
                Coach Observation
            </label>

            <textarea
                id="coach_observation"
                name="coach_observation"
                placeholder="Enter your observation about the player's performance..."
                required
            >{{ observation['coach_observation'] if observation else '' }}</textarea>


            <div class="buttons">

                <button type="submit">
                    Save Observation
                </button>

                <a
                    class="back-button"
                    href="{{ url_for(
                        'session_details',
                        team_id=team['team_id'],
                        session_id=session['session_id']
                    ) }}"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
