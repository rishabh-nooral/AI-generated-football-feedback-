<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Football Coach</title>
    <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <div class="football-icon">⚽</div>
            <h1>Create Account</h1>
            <p class="auth-subtitle">Register as a new AI Football Coach user.</p>

            <div id="message" class="auth-message" hidden></div>

            <form action="/register" method="POST" class="auth-form" id="registerForm">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <label for="confirm_password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Enter password again"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <button type="submit" class="auth-button primary">Register</button>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="/login">Login</a>
            </p>

            <a class="back-link" href="/">← Back to landing</a>
        </section>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const message = document.getElementById("message");
        const form = document.getElementById("registerForm");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirm_password");

        if (params.get("error")) {
            message.textContent = params.get("error");
            message.className = "auth-message error";
            message.hidden = false;
        }

        form.addEventListener("submit", function (event) {
            if (password.value !== confirmPassword.value) {
                event.preventDefault();
                message.textContent = "Passwords do not match.";
                message.className = "auth-message error";
                message.hidden = false;
            }
        });
    </script>
</body>
</html>
